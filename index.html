<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Admin Panel - Schovávačka</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #020d18; color: #4df;
    display: flex; flex-direction: column; align-items: center; padding: 20px;
  }
  h1 { color: #0ff; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 20px;}
  .card {
    background: #031526; border: 1px solid #0ff4; border-radius: 10px;
    padding: 20px; margin-bottom: 20px; width: 100%; max-width: 400px;
    box-shadow: 0 5px 15px #0008;
  }
  label { display: block; margin-bottom: 10px; font-size: 0.9em; color: #08a; }
  input[type="time"] {
    width: 100%; padding: 10px; font-size: 1.2em; border: 1px solid #0ff;
    border-radius: 5px; background: #010811; color: #0ff; margin-bottom: 15px;
  }
  button {
    width: 100%; padding: 12px; font-size: 1.1em; border: 1px solid #0ff;
    border-radius: 5px; background: #068; color: #0ff; cursor: pointer;
    font-weight: bold; text-transform: uppercase; margin-bottom: 10px;
  }
  button:active { background: #0ff; color: #020d18; }
  .confirm-btn { background: #080; border-color: #0f0; color: #fff; }
  .confirm-btn:active { background: #0f0; color: #000; }
  .danger-btn { background: #800; border-color: #f00; color: #fcc; }
  .danger-btn:active { background: #f00; color: #fff; }
  #status { margin-top: 10px; font-size: 0.9em; color: #0f0; text-align: center; min-height: 20px; }
  .info-text { font-size: 0.85em; color: #888; margin-top: 5px; text-align: center;}
</style>
</head>
<body>

<h1>Admin Panel</h1>

<div class="card">
  <label>Nastaviť čas začiatku hry (dnes):</label>
  <input type="time" id="time-input">
  <button id="set-time-btn">1. Nahrať čas do databázy</button>
  <div class="info-text" style="margin-bottom: 20px;">Čas sa nahrá, ale ESP ho zatiaľ do seba neuzamknú.</div>
  
  <button id="confirm-time-btn" class="confirm-btn">2. Potvrdiť čas</button>
  <button id="unconfirm-time-btn" style="background:#550; border-color:#aa0; color:#ff0; margin-bottom: 15px;">Zrušiť potvrdenie (Odomknúť)</button>
  <div class="info-text">Potvrdením sa čas uzamkne. ESP prestanú blikať a začnú svietiť. Ak zrušíš potvrdenie, môžeš zadať nový čas.</div>
</div>

<div class="card">
  <label>Odpojenie zariadení (Štart nezávislej prevádzky):</label>
  <button id="disconnect-btn" class="danger-btn">3. Odpojiť ESP a spustiť</button>
  <div class="info-text">Pošle signál, ESP zhasnú, odpoja sa od admin WiFi a začnú odpočítavať z vnútorných hodín. Následne môžeš túto sieť vypnúť.</div>
  
  <button id="reset-disconnect-btn" style="background:#222; border-color:#555; color:#888; margin-top:30px; padding: 8px;">Zrušiť signál Odpojenia (pre testy)</button>
</div>

<div id="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARnXz5vKW8hg_ItOXBBWEQfbhGNpQ7SJk",
    authDomain: "schovka-2dbf3.firebaseapp.com",
    databaseURL: "https://schovka-2dbf3-default-rtdb.firebaseio.com",
    projectId: "schovka-2dbf3",
    storageBucket: "schovka-2dbf3.firebasestorage.app",
    messagingSenderId: "757984320237",
    appId: "1:757984320237:web:bd8db632b3e6a2e60d0ae4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const statusEl = document.getElementById('status');
  function showStatus(msg, color="#0f0") {
    statusEl.textContent = msg;
    statusEl.style.color = color;
    setTimeout(() => { statusEl.textContent = ""; }, 6000);
  }

  const now = new Date();
  document.getElementById('time-input').value = now.toTimeString().substring(0,5);

  document.getElementById('set-time-btn').addEventListener('click', () => {
    const timeStr = document.getElementById('time-input').value;
    if(!timeStr) return;
    const [hours, minutes] = timeStr.split(':').map(Number);
    const targetDate = new Date();
    targetDate.setHours(hours, minutes, 0, 0);
    const unixSeconds = Math.floor(targetDate.getTime() / 1000);

    update(ref(db, 'game'), {
      start_time: unixSeconds,
      time_confirmed: false
    }).then(() => { showStatus(`Čas ${timeStr} nahraný. Zatiaľ nepotvrdený.`, '#ff0'); })
      .catch((error) => { showStatus("Chyba: " + error.message, "#f00"); });
  });

  document.getElementById('confirm-time-btn').addEventListener('click', () => {
    set(ref(db, 'game/time_confirmed'), true)
      .then(() => { showStatus('Čas bol potvrdený! ESP by mali svietiť trvalo.', '#0f0'); })
      .catch((error) => { showStatus("Chyba: " + error.message, "#f00"); });
  });

  document.getElementById('unconfirm-time-btn').addEventListener('click', () => {
    set(ref(db, 'game/time_confirmed'), false)
      .then(() => { showStatus('Potvrdenie zrušené. Môžeš zadať nový čas.', '#ff0'); })
      .catch((error) => { showStatus("Chyba: " + error.message, "#f00"); });
  });

  document.getElementById('disconnect-btn').addEventListener('click', () => {
    if(confirm('Naozaj chceš odpojiť všetky ESP?')) {
      set(ref(db, 'game/disconnect'), true)
        .then(() => showStatus('Signál na odpojenie odoslaný!', '#0f0'))
        .catch((error) => showStatus("Chyba: " + error.message, "#f00"));
    }
  });

  document.getElementById('reset-disconnect-btn').addEventListener('click', () => {
    set(ref(db, 'game/disconnect'), false)
      .then(() => showStatus('Signál odpojenia zrušený.'));
  });
</script>

</body>
</html>
